<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Air Quality App Flowchart - A4</title>
  <style>
    @page {
      size: A4 landscape;
      margin: 0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #e7ecf2;
      font-family: Arial, sans-serif;
    }

    .page {
      width: 297mm;
      height: 210mm;
      margin: 0 auto;
      padding: 8mm;
      background: #ffffff;
      color: #14213d;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 5mm;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 8mm;
      border-bottom: 1px solid #d8e0ea;
      padding-bottom: 3mm;
    }

    .title {
      margin: 0;
      font-size: 16pt;
      line-height: 1.1;
    }

    .subtitle {
      margin: 1mm 0 0;
      font-size: 8.5pt;
      color: #4b5b73;
    }

    .meta {
      font-size: 8pt;
      color: #6b778d;
      white-space: nowrap;
    }

    .layout {
      min-height: 0;
      display: grid;
      grid-template-columns: 0.95fr 1.35fr;
      gap: 5mm;
    }

    .right {
      min-height: 0;
      display: grid;
      grid-template-rows: 1.18fr 0.82fr;
      gap: 5mm;
    }

    .panel {
      min-width: 0;
      min-height: 0;
      border: 1px solid #d8e0ea;
      border-radius: 10px;
      background: #fbfcfe;
      padding: 3mm;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 2mm;
      overflow: hidden;
    }

    .panel h2 {
      margin: 0;
      font-size: 9.5pt;
      line-height: 1.2;
      color: #17345d;
    }

    .diagram {
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .diagram img {
      max-width: 100%;
      max-height: 100%;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div>
        <h1 class="title">Air Quality App Flowchart</h1>
        <p class="subtitle">Single-page A4 layout based on the diagrams defined in <code>docs/app-flowchart.md</code>.</p>
      </div>
      <div class="meta">A4 Landscape</div>
    </header>

    <section class="layout">
      <article class="panel">
        <h2>1. End-to-End System Flow</h2>
        <div class="diagram">
          <img alt="End-to-end system flowchart" src="app-flowchart-system.svg">
        </div>
      </article>

      <div class="right">
        <article class="panel">
          <h2>2. Web App Navigation and Data Flow</h2>
          <div class="diagram">
            <img alt="Web app navigation and data flowchart" src="app-flowchart-web.svg">
          </div>
        </article>

        <article class="panel">
          <h2>3. Backend Read Endpoints Used by the Web App</h2>
          <div class="diagram">
            <img alt="Backend read endpoints flowchart" src="app-flowchart-backend.svg">
          </div>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
